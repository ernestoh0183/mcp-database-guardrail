[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-database-guardrail"
version = "1.0.0"
description = "Enterprise-grade Model Context Protocol (MCP) server for secure, read-only database exploration (SQLite, PostgreSQL, MySQL) with AST guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rodrigo Ernesto Hernández Buitrago", email = "rodrigo@4ruy.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "claude-desktop",
    "cursor",
    "sqlite",
    "postgresql",
    "mysql",
    "database-guardrails",
    "zero-trust"
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.0.0",
    "sqlparse>=0.5.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://www.4ruy.com"
Repository = "https://github.com/ernestoh0183/mcp-database-guardrail"
